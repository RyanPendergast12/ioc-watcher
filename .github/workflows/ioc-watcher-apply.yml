name: ioc-watcher-apply

on:
  repository_dispatch:
    types: [ioc-decision]

permissions:
  contents: write

concurrency:
  group: ioc-watcher-repo
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # client_payload is passed as data via env — never interpolated into shell
      PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_ALLOWED_USER_IDS: ${{ secrets.DISCORD_ALLOWED_USER_IDS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Apply decision
        run: python -m watcher.apply

      - name: Commit
        run: |
          git config user.name "ioc-watcher[bot]"
          git config user.email "ioc-watcher@users.noreply.github.com"
          git add -A pending approved archive
          if ! git diff --cached --quiet; then
            ID=$(python -c "import json,os,re; print(re.sub(r'[^a-z0-9]','',str(json.loads(os.environ['PAYLOAD']).get('proposal_id',''))))")
            DEC=$(python -c "import json,os; d=json.loads(os.environ['PAYLOAD']).get('decision'); print(d if d in ('approve','deny') else 'unknown')")
            git commit -m "apply: ${DEC} ${ID}"
            git pull --rebase --quiet && git push
          fi

      - name: Report failure to Discord
        if: failure()
        run: python -m watcher.apply --report-failure
