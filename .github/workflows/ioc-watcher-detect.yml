name: ioc-watcher-detect

on:
  schedule:
    - cron: "17 11 * * *"          # daily 11:17 UTC (≈6 AM ET)
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated source names to run (blank = all)"
        required: false
        default: ""
      repost_only:
        description: "Skip detection, just (re)post unposted pending proposals to Discord"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ioc-watcher-repo        # shared with apply so commits never race
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
      OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
      ABUSEIPDB_API_KEY: ${{ secrets.ABUSEIPDB_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Detect
        if: ${{ !inputs.repost_only }}
        env:
          ONLY: ${{ inputs.only }}
        run: python -m watcher.detect --only "$ONLY"

      - name: Commit proposals + state
        run: |
          git config user.name "ioc-watcher[bot]"
          git config user.email "ioc-watcher@users.noreply.github.com"
          git add pending state
          if ! git diff --cached --quiet; then
            git commit -m "detect: $(ls pending | wc -l) pending proposals ($(date -u +%F))"
            git pull --rebase --quiet && git push
          fi

      - name: Post to Discord
        run: python -m watcher.post

      - name: Commit Discord message ids
        run: |
          git add pending
          if ! git diff --cached --quiet; then
            git commit -m "post: record Discord message ids"
            git pull --rebase --quiet && git push
          fi
